<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start mb-4 gap-3">
      <div>
        <p class="eyebrow">Admin Dashboard</p>
        <h1>Manage Quiz Questions</h1>
        <p class="text-muted">Add, edit, or remove questions and set the weighting for each answer.</p>
      </div>
      <div class="d-flex gap-2">
        <a href="manage-questions.html" class="btn btn--primary">Manage Quiz Questions</a>
        <a href="../index.html" class="btn btn--secondary">Return to Quiz</a>
      </div>
    </div>

    <div id="message" class="alert d-none" role="alert"></div>

    <section class="mb-5">
      <h2 class="h5 mb-3">Question Editor</h2>
      <form id="questionForm" class="card card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="questionId" class="form-label">Question ID (optional)</label>
            <input id="questionId" class="form-control" type="number" min="1" placeholder="Leave blank to auto generate" />
            <div class="form-text">Use this to add a specific question number to the quiz.</div>
          </div>
          <div class="col-md-8">
            <label for="questionText" class="form-label">Question text</label>
            <input id="questionText" class="form-control" type="text" required placeholder="Enter the quiz question" />
          </div>
          <div class="col-md-4">
            <label for="optionCount" class="form-label">Option count</label>
            <input id="optionCount" class="form-control" type="number" min="2" max="6" value="4" />
            <div class="form-text">Choose 2 to 6 answer choices for this question.</div>
          </div>
        </div>

        <div class="mt-4">
          <h3 class="h6 mb-3">Options</h3>
          <div id="optionFields" class="row gy-4"></div>
        </div>

        <div class="mt-4 d-flex flex-wrap gap-2">
          <button id="publishBtn" type="submit" class="btn btn-lg btn-success">Publish Question</button>
          <button id="draftBtn" type="button" class="btn btn-lg btn-outline-info">Save as Draft</button>
          <button id="cancelEditBtn" type="button" class="btn btn-outline-secondary d-none">Cancel edit</button>
        </div>
      </form>
    </section>

    <section>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Existing Questions</h2>
        <button id="refreshBtn" type="button" class="btn btn-outline-primary btn-sm">Refresh</button>
      </div>
      <div id="questionList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
