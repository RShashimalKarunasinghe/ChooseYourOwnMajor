<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Quiz Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start mb-4 gap-3">
      <div>
        <p class="eyebrow">Quiz Management</p>
        <h1>Manage Quiz Questions</h1>
        <p class="text-muted">Add or remove published questions from the active quiz.</p>
      </div>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn--secondary">Back to Admin</a>
        <a href="../index.html" class="btn btn--secondary">Return to Quiz</a>
      </div>
    </div>

    <div id="message" class="alert d-none" role="alert"></div>

    <section>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Published Questions</h2>
        <button id="refreshBtn" type="button" class="btn btn-outline-primary btn-sm">Refresh</button>
      </div>
      <div id="questionList" class="row g-3"></div>
    </section>

    <hr class="my-5" />

    <section>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h5 mb-0">Active Quiz Questions</h2>
        <span class="badge bg-info" id="activeCount">0</span>
      </div>
      <div id="activeQuestionList" class="row g-3"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
